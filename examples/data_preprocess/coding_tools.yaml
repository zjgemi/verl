# Tool configuration for scientific coding agentic RL
# Used by: actor_rollout_ref.rollout.multi_turn.tool_config_path
#
# Each tool entry specifies:
#   class_name: fully qualified Python class path
#   config:     tool-specific configuration (passed to __init__)
#   tool_schema: OpenAI function-calling schema (optional; auto-generated by get_openai_tool_schema if omitted)

tools:
  - class_name: verl_coding.coding_sandbox_tool.SandboxTool
    config:
      type: native
      images_path: /personal/sp2/qwen_trajs/cc_deepseek_1w/images.json
    tool_schema:
      type: function
      function:
        name: execute_command
        description: >
          Execute a shell command inside the sandbox environment. Use this to write Python code
          to files, run scripts, install packages, inspect files, or execute any shell command
          needed to solve the coding problem. The sandbox has all required scientific computing
          packages pre-installed.
        parameters:
          type: object
          properties:
            command:
              type: string
              description: The shell command to execute in the sandbox.
            timeout:
              type: integer
              description: "Optional timeout in seconds (default: 600)."
          required:
            - command
        strict: false

  - class_name: verl_coding.coding_sandbox_tool.WebSearchTool
    config:
      type: native
      bohrium_api_key: ""  # Set via environment variable BOHRIUM_ACCESS_KEY
    tool_schema:
      type: function
      function:
        name: web_search
        description: >
          Search the open web for documentation, tutorials, API references, or any
          information needed to solve the coding problem.
        parameters:
          type: object
          properties:
            query:
              type: string
              description: The search query string.
            num:
              type: integer
              description: "Number of results to return (1-10, default: 5)."
          required:
            - query
        strict: false